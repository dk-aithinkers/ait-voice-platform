# Local first pass, per `team.md`:
#
#   Pre-commit hooks (formatting, lint, secret scanning) run locally as a first
#   pass; CI status checks are what actually stand in for the missing review.
#
# So this is convenience, not the gate. Everything here also runs in CI, which
# is what `main` is actually protected by — a hook the committer can skip with
# `--no-verify` is not a control.
#
# Install once:  uv run pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # The one hook here that catches something irreversible. A key pushed to
      # a remote is compromised even after the commit is removed.
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
