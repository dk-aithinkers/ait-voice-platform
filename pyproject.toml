[project]
name = "ait-voice"
version = "0.1.0"
description = "Multi-tenant AI voice agent platform — healthcare receptionist pack"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    # Used only by the credential reachability check. Every vendor SDK already
    # depends on it; declaring it makes that dependency ours rather than
    # inherited, since we import it directly.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Provider extras. Install only what a deployment actually uses — the point of
# the provider boundary (constraint C-T1) is that no deployment needs all of them.
anthropic = ["anthropic>=0.40"]
deepgram = ["deepgram-sdk>=3.7"]
elevenlabs = ["elevenlabs>=1.9"]
twilio = ["twilio>=9.3", "websockets>=13.0"]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]
postgres = [
    "asyncpg>=0.31.0",
]

[project.scripts]
ait-voice = "ait_voice.cli:main"
ait-voice-migrate = "ait_voice.db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ait_voice"]

# ---------------------------------------------------------------------------
# Ruff — lint and Python SAST in one gate.
#
# The security review at practices discovery recommended Ruff alone over
# Black + Ruff, because selecting the S (bandit), T20, G, B and ASYNC rule sets
# puts Python static analysis inside the lint gate at zero marginal cost. That
# matters under contended capacity.
#
# T20 and G are not style rules here. They are what makes it possible to catch
# PHI reaching a print() or an f-string log call — the Tier B control from the
# security review, which only works if PHI-carrying values are nominally
# distinguishable.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "S",         # bandit — Python SAST
    "T20",       # flake8-print — no print() in library code
    "G",         # flake8-logging-format — no f-strings in log calls
    "ASYNC",     # async correctness
    "UP",        # pyupgrade
]
ignore = [
    "S101",      # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/ait_voice/cli.py" = ["T20"]  # the CLI is the one place print() is the point
# The CI gates are command-line tools whose entire output is their report.
"scripts/**" = ["T20"]
"src/ait_voice/db/migrate.py" = ["T20"]  # a CLI; its output is the report

# ---------------------------------------------------------------------------
# Coverage — per-package BRANCH coverage, not global line coverage.
#
# Decided at requirements analysis: every Hard regulatory constraint is a
# branch (consent expiry, BAA gating, jurisdiction routing), and 80% line
# coverage is reachable without ever taking the India branch. A global floor
# would also let the compliance core sit at 55% while simpler code carries the
# average.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A forgotten `await` on a store call yields a coroutine, and a coroutine is
# truthy — so `assert store.get(...)` would pass while asserting nothing. Since
# the repositories are async and the stores they replaced were not, that is the
# single most likely way a test here goes quietly green. Python already notices;
# this makes it fail the build instead of scrolling past in the warnings summary.
# Two entries because the warning can arrive by two routes: raised inline if
# the coroutine is collected during the test, or — more often — at garbage
# collection, where pytest re-emits it as PytestUnraisableExceptionWarning.
# Only catching the first would leave the common case scrolling past.
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
# So tests can import the CI gates in `scripts/` and check their logic
# directly rather than only through a subprocess.
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src/ait_voice"]

[tool.coverage.report]
show_missing = true
# Vendor transport adapters may be excluded from the floor, but owe contract or
# recorded-fixture tests instead — an exclusion with no replacement obligation
# is how a coverage gate becomes decorative.
#
# Nothing is omitted wholesale. The one exclusion is `serve()` in the Twilio
# provider, marked `# pragma: no cover` at the function with its reason stated
# there: it binds a socket rather than translating anything, and the handshake
# contract it depends on is covered in tests/test_provider_contracts.py.
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
# Vendor SDKs ship incomplete or absent stubs. Ignoring their *imports* is not
# the same as ignoring our own types, and the provider boundary means the
# untyped surface is confined to `providers/`.
ignore_missing_imports = true
# Tests are checked, but not to the same standard as `src`, and the difference
# is deliberate rather than lazy.
#
# `src` holds the compliance logic — the tenant boundary, the PHI wrappers, the
# BAA gate — and is checked under full `strict`. That is where a type error is
# a disclosure risk.
#
# A test, by contrast, frequently passes a deliberately wrong type to assert
# that it is refused, and reaches through `X | None` after an assertion mypy
# cannot see. Demanding strictness there makes the suite argue with itself
# without making the product safer. What stays on is everything that catches a
# test being wrong about the code: attribute names, call signatures, and
# argument types are all still checked.
#
# `tests/__init__.py` exists so mypy names these `tests.test_x` and this
# pattern matches — mypy only wildcards whole module components.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_return_any = false
# Reaching through an Optional the test has already established is not-None.
disable_error_code = ["union-attr", "index"]
