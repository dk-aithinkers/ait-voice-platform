[project]
name = "ait-voice"
version = "0.1.0"
description = "Multi-tenant AI voice agent platform — healthcare receptionist pack"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    # Used only by the credential reachability check. Every vendor SDK already
    # depends on it; declaring it makes that dependency ours rather than
    # inherited, since we import it directly.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Provider extras. Install only what a deployment actually uses — the point of
# the provider boundary (constraint C-T1) is that no deployment needs all of them.
anthropic = ["anthropic>=0.40"]
deepgram = ["deepgram-sdk>=3.7"]
elevenlabs = ["elevenlabs>=1.9"]
twilio = ["twilio>=9.3", "websockets>=13.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
ait-voice = "ait_voice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ait_voice"]

# ---------------------------------------------------------------------------
# Ruff — lint and Python SAST in one gate.
#
# The security review at practices discovery recommended Ruff alone over
# Black + Ruff, because selecting the S (bandit), T20, G, B and ASYNC rule sets
# puts Python static analysis inside the lint gate at zero marginal cost. That
# matters under contended capacity.
#
# T20 and G are not style rules here. They are what makes it possible to catch
# PHI reaching a print() or an f-string log call — the Tier B control from the
# security review, which only works if PHI-carrying values are nominally
# distinguishable.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "S",         # bandit — Python SAST
    "T20",       # flake8-print — no print() in library code
    "G",         # flake8-logging-format — no f-strings in log calls
    "ASYNC",     # async correctness
    "UP",        # pyupgrade
]
ignore = [
    "S101",      # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/ait_voice/cli.py" = ["T20"]  # the CLI is the one place print() is the point

# ---------------------------------------------------------------------------
# Coverage — per-package BRANCH coverage, not global line coverage.
#
# Decided at requirements analysis: every Hard regulatory constraint is a
# branch (consent expiry, BAA gating, jurisdiction routing), and 80% line
# coverage is reachable without ever taking the India branch. A global floor
# would also let the compliance core sit at 55% while simpler code carries the
# average.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/ait_voice"]

[tool.coverage.report]
show_missing = true
# Vendor transport adapters may be excluded from the floor, but owe contract or
# recorded-fixture tests instead — an exclusion with no replacement obligation
# is how a coverage gate becomes decorative.
#
# Nothing is omitted wholesale. The one exclusion is `serve()` in the Twilio
# provider, marked `# pragma: no cover` at the function with its reason stated
# there: it binds a socket rather than translating anything, and the handshake
# contract it depends on is covered in tests/test_provider_contracts.py.
exclude_also = ["if TYPE_CHECKING:"]
